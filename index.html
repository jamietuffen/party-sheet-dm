<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0B0E">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Party Sheet · DM chat</title>
<!--
  The DM's side of a Party Sheet private chat. A player's app shows a link (this page + #room) and a PIN.
  Messages go through the ntfy.sh relay, encrypted in the browser, so the relay only sees scrambled text.
    - The PIN (PBKDF2, the room as salt) only protects join requests and the player's answer.
    - This page makes an ECDH key pair; with the player's public key that gives a secret only the two share.
      Whispers to the player, and the chat key, go over that secret.
    - Chat messages use a random chat key that the player sends each allowed person privately.
    - If the player removes someone, everyone else is sent a new room and chat key over their own secret and
      moves there automatically; the removed person can't read it.
  This tab remembers its keys (sessionStorage), so a reload goes straight back in.
  Source: d-d-alan-elk/dm-page/index.html. No keys or personal data live in this file.
-->
<style>
:root{--bg:#101216;--surface:#1A1D23;--surface-2:#22262D;--ink:#ECEEF1;--muted:#9AA1AC;--line:#2E333B;--accent:#E35858;--good:#5CC48A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:620px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 16px;min-height:100%;display:flex;flex-direction:column}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.btn{display:block;width:100%;margin-top:14px;padding:13px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:700;letter-spacing:.04em}
.btn:disabled{opacity:.5}
.msg{color:var(--muted);font-size:14px;margin:10px 0 0;min-height:20px}
.chat{flex:1;display:none;flex-direction:column;min-height:0}
.log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px 0}
.b{max-width:80%;padding:9px 12px;border-radius:14px;background:var(--surface-2);white-space:pre-wrap;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.b.them{align-self:flex-start;border-bottom-left-radius:4px}
.b.wh{border:1px dashed var(--muted)}
.b i{opacity:.7}
.b small{display:block;font-size:11px;opacity:.75;margin-top:2px}
.sys{align-self:center;color:var(--muted);font-size:13px;text-align:center}
.to{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.to select{flex:1;padding:8px 10px}
.send{display:flex;gap:8px;padding:8px 0 max(8px,env(safe-area-inset-bottom))}
.send textarea{resize:none;height:48px}
.send .btn{width:auto;margin:0;padding:0 18px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.on{background:var(--good)}
#room::placeholder{text-transform:none;letter-spacing:normal}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Private chat</h1>
  <p class="sub" id="status"><span class="dot" id="dot"></span><span id="status-text">Party Sheet DM chat</span></p>

  <div class="card" id="join">
    <p style="margin:0" id="jintro">Enter your name and the PIN the player gave you. They'll be asked to let you in.</p>
    <div id="roomrow" style="display:none"><label for="room">Room code</label><input id="room" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="9" placeholder="e.g. K7Q-M4P" style="text-transform:uppercase;letter-spacing:.08em"></div>
    <label for="name">Your name</label><input id="name" autocomplete="nickname" maxlength="40" placeholder="e.g. Mira (DM)">
    <label for="pin">PIN</label><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digits">
    <button class="btn" id="go">Ask to join</button>
    <p class="msg" id="jmsg"></p>
  </div>

  <div class="chat" id="chat">
    <div class="log" id="log"></div>
    <div class="to">Send to <select id="to"><option value="">Everyone</option><option value="player" id="to-player">The player only</option></select></div>
    <div class="send"><textarea id="text" placeholder="Message"></textarea><button class="btn" id="send">Send</button></div>
  </div>
</div>
<script>
(function(){
"use strict";
var RELAY="https://ntfy.sh/";
var el=function(id){return document.getElementById(id);};
// Room codes are 6 characters (shown as ABC-DEF; chats started before were 8); typed ones may have a dash, underscore, spaces or small letters
function normRoom(s){return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");}
function goodRoom(s){return /^[A-HJKMNP-Z2-9]{6}([A-HJKMNP-Z2-9]{2})?$/.test(s);}
var room=normRoom((location.hash||"").slice(1));if(!goodRoom(room))room="";
var S={id:"",name:"",pair:null,pub:"",joinKey:null,chatKey:null,chatRaw:"",ppub:"",pairKey:null,player:"the player",allowed:false};
var es=null,lastId="",seen={},since=Math.floor(Date.now()/1000)-60;
var enc=new TextEncoder(),dec=new TextDecoder();

function b64(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function rid(){var a=new Uint8Array(9);crypto.getRandomValues(a);return b64(a).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function status(t,on){el("status-text").textContent=t;el("dot").classList.toggle("on",!!on);}
function add(cls,text,meta,italic){var d=document.createElement("div");d.className=cls;var body=document.createElement(italic?"i":"span");body.textContent=text;d.appendChild(body);
  if(meta){var s=document.createElement("small");s.textContent=meta;d.appendChild(s);}el("log").appendChild(d);el("log").scrollTop=el("log").scrollHeight;}
function time(ts){return new Date(ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});}

// Keys
function pinKey(pin,r){return crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveKey"]).then(function(base){
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:enc.encode("party-sheet:"+r),iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);});}
function newPair(){return crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveKey"]);}
// The secret this page shares with the player
function playerKey(ppub){
  if(S.pairKey&&S.ppub===ppub)return Promise.resolve(S.pairKey);
  return crypto.subtle.importKey("raw",unb64(ppub),{name:"ECDH",namedCurve:"P-256"},false,[]).then(function(p){
    return crypto.subtle.deriveKey({name:"ECDH",public:p},S.pair.privateKey,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  }).then(function(k){S.ppub=ppub;S.pairKey=k;return k;});
}
function importChatKey(raw){return crypto.subtle.importKey("raw",unb64(raw),{name:"AES-GCM"},false,["encrypt","decrypt"]);}
function aes(key,obj){var iv=crypto.getRandomValues(new Uint8Array(12));return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,enc.encode(JSON.stringify(obj))).then(function(ct){return {iv:b64(iv),ct:b64(ct)};});}
function unaes(key,box){return crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.ct)).then(function(pt){return JSON.parse(dec.decode(pt));});}
// Envelopes: k "j" = PIN key (join requests and answers), k "g" = chat key (everything else)
function post(k,obj){var key=k==="j"?S.joinKey:S.chatKey;return aes(key,obj).then(function(box){return fetch(RELAY+"ps-"+room,{method:"POST",body:JSON.stringify({v:2,k:k,iv:box.iv,ct:box.ct})});})
  .then(function(r){if(!r.ok)throw new Error("relay "+r.status);});}
function openEnv(text){var o;try{o=JSON.parse(text);}catch(e){return Promise.reject();}if(!o||o.v!==2)return Promise.reject();
  var key=o.k==="g"?S.chatKey:S.joinKey;if(!key)return Promise.reject();return unaes(key,o);}

// This tab remembers who it is and its keys, so a reload goes straight back into the chat
function save(){
  if(!S.pair||!S.chatRaw)return;
  crypto.subtle.exportKey("jwk",S.pair.privateKey).then(function(priv){
    try{sessionStorage.setItem("ps-dm",JSON.stringify({room:room,id:S.id,name:S.name,pub:S.pub,priv:priv,chat:S.chatRaw,ppub:S.ppub,player:S.player,lastId:lastId}));}catch(e){}});
}
function forget(){try{sessionStorage.removeItem("ps-dm");}catch(e){}}
function restore(){
  var st;try{st=JSON.parse(sessionStorage.getItem("ps-dm")||"null");}catch(e){st=null;}
  if(!st||!st.chat||!st.room)return Promise.resolve(false);
  if(st.room!==room){room=st.room;history.replaceState(null,"","#"+room);}   // the chat moved while this tab was away
  return Promise.all([crypto.subtle.importKey("jwk",st.priv,{name:"ECDH",namedCurve:"P-256"},true,["deriveKey"]),importChatKey(st.chat)]).then(function(k){
    S.id=st.id;S.name=st.name;S.pub=st.pub;S.pair={privateKey:k[0]};S.chatKey=k[1];S.chatRaw=st.chat;S.ppub=st.ppub;S.player=st.player;S.allowed=true;lastId=st.lastId||"";
    return playerKey(st.ppub).then(function(){return true;});
  }).catch(function(){return false;});
}

function inChat(){el("title").textContent="Chat with "+S.player;el("to-player").textContent=S.player+" only";el("join").style.display="none";el("chat").style.display="flex";status("Connected to "+S.player,true);}
function stop(text,st){add("sys",text);status(st,false);el("send").disabled=true;el("text").disabled=true;el("to").disabled=true;S.allowed=false;forget();if(es)es.close();}
function listen(){
  if(es)es.close();
  var r=room;
  es=new EventSource(RELAY+"ps-"+r+"/sse?since="+(lastId||since));
  es.onopen=function(){if(S.allowed)status("Connected to "+S.player,true);};
  es.onerror=function(){if(S.allowed)status("Reconnecting…",false);};
  es.onmessage=function(ev){
    var m;try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.event!=="message"||seen[m.id]||r!==room)return;seen[m.id]=1;
    openEnv(m.message).then(handle).catch(function(){}).then(function(){if(r===room){lastId=m.id;save();}});   // not for us, or a key we don't have
  };
}
function handle(x){
  if(x.t==="allow"&&x.to===S.id&&!S.allowed){
    // The answer carries the player's public key and, sealed to this page alone, the chat key
    return playerKey(x.ppub).then(function(pk){return unaes(pk,x.box);}).then(function(k){S.chatRaw=k.gk;return importChatKey(k.gk);}).then(function(ck){
      S.chatKey=ck;S.allowed=true;S.player=x.player||S.player;clearTimeout(S.hint);save();inChat();add("sys",S.player+" let you in.");el("text").focus();});
  }
  if(x.t==="deny"&&x.to===S.id&&!S.allowed){el("jmsg").textContent="The player said no.";el("go").disabled=false;return;}
  if(!S.allowed)return;
  if(x.t==="msg"){
    if(x.from===S.id){if(!seen["own"+x.ts]){seen["own"+x.ts]=1;add("b me"+(x.to?" wh":""),x.text||"",(x.to?"to "+(x.toName||S.player)+" only · ":"")+time(x.ts));}return;}
    var who=x.from==="player"?S.player:(x.name||"?");
    if(!x.to)return add("b them",x.text||"",who+" · "+time(x.ts));
    if(x.to===S.id&&x.from==="player"&&x.box)
      return playerKey(S.ppub).then(function(pk){return unaes(pk,x.box);}).then(function(p){add("b them wh",p.text||"",who+" · to you only · "+time(x.ts));});
    return add("b them wh","Hidden message",who+" · to "+(x.toName||"someone")+" · "+time(x.ts),true);
  }
  if(x.t==="move"&&x.to===S.id){
    // Someone was removed: the chat moves to a new room with a new key, sent to this page privately
    return playerKey(x.ppub).then(function(pk){return unaes(pk,x.box);}).then(function(k){
      return importChatKey(k.gk).then(function(ck){room=k.room;S.chatKey=ck;S.chatRaw=k.gk;lastId="";since=Math.floor(Date.now()/1000)-60;
        history.replaceState(null,"","#"+room);save();add("sys",x.why==="code"?"The player gave the chat a new, shorter room code. You've moved across automatically.":"Someone was removed from the chat. You've moved to a new private room.");listen();});});
  }
  if(x.t==="kicked"&&x.to===S.id)return stop("The player removed you from the chat.","Removed from the chat");
  if(x.t==="end")return stop("The player ended the chat.","Chat ended");
}

// No link: ask for the room code too
function askRoom(){
  el("title").textContent="Join a DM chat";status("Party Sheet DM chat",false);
  el("jintro").textContent="Enter the room code, your name and the PIN the player gave you. They’ll be asked to let you in.";
  el("roomrow").style.display="block";
  var help=document.createElement("p");help.className="msg";help.style.marginTop="14px";
  help.textContent="The player finds the room code and PIN in Party Sheet under Menu > Private DM chat > Invite. You can also open the link they send, or scan the QR code on their phone.";
  el("join").appendChild(help);
}
restore().then(function(back){if(back){inChat();add("sys","Back in the chat.");listen();}else if(!room)askRoom();});

el("go").onclick=function(){
  var name=el("name").value.trim(),pin=el("pin").value.trim();
  if(el("roomrow").style.display!=="none"){var r=normRoom(el("room").value);
    if(!goodRoom(r)){el("jmsg").textContent="The room code is 6 letters and numbers, like K7Q-M4P.";return;}
    if(r!==room){room=r;S.joinKey=null;history.replaceState(null,"","#"+room);}}
  if(!name){el("jmsg").textContent="Enter your name.";return;}
  if(!/^\d{6}$/.test(pin)){el("jmsg").textContent="The PIN is 6 digits.";return;}
  // Each try makes a fresh key from the PIN typed, so a wrong PIN can simply be corrected and sent again
  el("go").disabled=true;el("jmsg").textContent="Asking to join… waiting for the player to let you in.";clearTimeout(S.hint);
  S.name=name;S.id=S.id||rid();
  Promise.all([pinKey(pin,room),S.pair?Promise.resolve(S.pair):newPair()]).then(function(r){
    S.joinKey=r[0];S.pair=r[1];return crypto.subtle.exportKey("raw",S.pair.publicKey);
  }).then(function(pub){S.pub=b64(pub);listen();return post("j",{t:"join",id:S.id,name:name,pub:S.pub,ts:Date.now()});})
    .then(function(){setTimeout(function(){el("go").disabled=false;el("go").textContent="Ask again";},2500);
      S.hint=setTimeout(function(){if(!S.allowed)el("jmsg").textContent="No answer yet. Check the PIN with the player, or give them a moment to tap Allow.";},20000);})
    .catch(function(){el("jmsg").textContent="Couldn't reach the chat. Check your connection and try again.";el("go").disabled=false;});
};
el("send").onclick=function(){
  var text=el("text").value.trim(),to=el("to").value;if(!text||!S.allowed)return;
  var ts=Date.now();seen["own"+ts]=1;add("b me"+(to?" wh":""),text,(to?"to "+S.player+" only · ":"")+time(ts));el("text").value="";
  var msg={t:"msg",from:S.id,name:S.name,ts:ts},ready;
  if(to==="player"){msg.to="player";msg.toName=S.player;ready=playerKey(S.ppub).then(function(pk){return aes(pk,{text:text});}).then(function(box){msg.box=box;});}
  else{msg.text=text;ready=Promise.resolve();}
  ready.then(function(){return post("g",msg);}).catch(function(){add("sys","That message didn't send. Check your connection.");});
};
el("text").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();el("send").click();}});
})();
</script>
</body>
</html>
